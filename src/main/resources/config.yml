# MyDog configuration
#
# Messages live in messages.yml. Run "/mydog reload" after editing either file.

# Used by MyDog to upgrade this file. Do not change it.
config-version: 2

# Log extra information to the console.
debug: false

saving:
  # Write dogs.yml after every change instead of on a timer.
  instant: false
  # How often (in minutes) changed dog data is written to dogs.yml.
  autosave-minutes: 3

teleport:
  # Bring dogs along when their owner teleports, or when the chunk a dog is in unloads.
  # Sitting dogs always stay where they are.
  enabled: true
  # Also bring dogs along to other worlds.
  on-world-change: true
  # Apply teleporting to every tamed, sittable pet (cats, parrots, ...), not just MyDog dogs.
  all-tameables: false
  # Teleport one tick later and in batches, which can help on busy servers.
  experimental: false
  # When the owner is not standing somewhere safe, also search the blocks next to them
  # (not just straight up and down) for a safe spot.
  expanded-search: false
  distance-check:
    # Every 10 seconds, bring dogs that have wandered off back to their owner.
    enabled: true
    # How far away (in blocks) a dog has to be before it is brought back.
    max-distance: 30

dogs:
  # Give newly tamed dogs a random collar color.
  random-collar-color: true
  # Names given to new dogs. Leave empty to use the built-in list of 500+ names.
  names: []
  nametag:
    # Only show the nametag when a player looks at the dog.
    only-on-hover: false
    # Show the dog's level and attack/defend mode in the nametag (needs levels.enabled).
    show-level: true
  # Let owners rename their dog with a name tag.
  allow-nametag-rename: true
  # Let arrows hurt dogs.
  arrow-damage: false
  # Let dogs take damage from being crammed together (too many mobs in one spot). Off by default, since a pack of
  # dogs can easily end up in one spot, e.g. after being teleported or while chasing a mob they can't reach.
  cramming-damage: false
  # Share of the damage a dog deals that it heals back (0.25 = 25%, 0 turns it off).
  lifesteal: 0.25
  low-health-warning:
    # Warn the owner when their dog gets low on health.
    enabled: true
    # Warn below this share of the dog's max health (0.25 = 25%).
    threshold: 0.25
    # Minimum time between two warnings for the same dog, in milliseconds.
    cooldown-millis: 1000
  revival:
    # Keep dead dogs so they can be revived with "/mydog revive". When off, dead dogs are deleted.
    enabled: true
    # Revival cost per level of the dog.
    price-per-level: 200
    # Pay with experience levels instead of money (money needs Vault and an economy plugin).
    use-player-levels: false

levels:
  # Let dogs gain experience and level up by killing mobs.
  enabled: true
  # Sound played to the owner on level-up. Takes a sound key, see
  # https://minecraft.wiki/w/Sounds.json#Sound_events
  level-up-sound: entity.wolf.ambient
  # Let dogs gain experience from killing players.
  player-kill-experience: true
  # Experience needed for each level, and the max health and attack damage it gives.
  # Health is in half hearts (40 = 20 hearts, what a vanilla tamed wolf has). Vanilla wolves deal 4 damage.
  table:
    1: {experience: 0, health: 40, damage: 4}
    2: {experience: 10, health: 42, damage: 5}
    3: {experience: 100, health: 44, damage: 6}
    4: {experience: 200, health: 46, damage: 7}
    5: {experience: 500, health: 48, damage: 8}
    6: {experience: 1000, health: 52, damage: 11}
    7: {experience: 2000, health: 58, damage: 13}
    8: {experience: 3000, health: 62, damage: 15}
    9: {experience: 4000, health: 66, damage: 17}
    10: {experience: 5000, health: 72, damage: 20}
  # Experience a dog gets for each kill.
  # Keys are entity types, see https://minecraft.wiki/w/Java_Edition_data_values#Entities
  experience-per-kill:
    # Mobs that are not listed below (including mobs added to Minecraft later) give this much; 0 gives nothing.
    # Players only give experience through their own entry and player-kill-experience.
    default: 2
