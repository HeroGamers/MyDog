# MyDog configuration
#
# Messages live in messages.yml. Run "/mydog reload" after editing either file.

# Used by MyDog to upgrade this file. Do not change it.
config-version: 2

# Log extra information to the console.
debug: false

saving:
  # Write dogs.yml after every change instead of on a timer.
  instant: false
  # How often (in minutes) changed dog data is written to dogs.yml.
  autosave-minutes: 3

teleport:
  # Bring dogs along when their owner teleports, or when the chunk a dog is in unloads.
  # Sitting dogs always stay where they are.
  enabled: true
  # Also bring dogs along to other worlds.
  on-world-change: true
  # Apply teleporting to every tamed, sittable pet (cats, parrots, ...), not just MyDog dogs.
  all-tameables: false
  # When the owner is not standing somewhere safe, also search the blocks next to them
  # (not just straight up and down) for a safe spot.
  expanded-search: false
  distance-check:
    # Every 10 seconds, bring dogs that have wandered off back to their owner.
    enabled: true
    # How far away (in blocks) a dog has to be before it is brought back.
    max-distance: 30

dogs:
  # Give newly tamed dogs a random collar color.
  random-collar-color: true
  # Names given to new dogs. Leave empty to use the built-in list of 500+ names.
  names: []
  nametag:
    # Only show the nametag when a player looks at the dog.
    only-on-hover: false
    # Show the dog's level and attack/defend mode in the nametag (needs levels.enabled).
    show-level: true
  # Let owners rename their dog with a name tag.
  allow-nametag-rename: true
  # Let arrows hurt dogs.
  arrow-damage: false
  # Let dogs take damage from being crammed together (too many mobs in one spot). Off by default, since a pack of
  # dogs can easily end up in one spot, e.g. after being teleported or while chasing a mob they can't reach.
  cramming-damage: false
  protection:
    # Stop other players from hurting your dogs (owners can never hurt their own dogs). Players with the
    # mydog.harm.others permission still can.
    from-other-players: false
    # Dogs can't be hurt at all, except by /kill and falling out of the world.
    invulnerable: false
  # How long /mydog calm keeps dogs from picking a fight, in seconds.
  calm-seconds: 10
  # Share of the damage a dog deals that it heals back (0.25 = 25%, 0 turns it off).
  lifesteal: 0.25
  low-health-warning:
    # Warn the owner when their dog gets low on health.
    enabled: true
    # Warn below this share of the dog's max health (0.25 = 25%).
    threshold: 0.25
    # Minimum time between two warnings for the same dog, in milliseconds.
    cooldown-millis: 1000
  revival:
    # Keep dead dogs so they can be revived with "/mydog revive". When off, dead dogs are deleted.
    enabled: true
    # Revival cost per level of the dog.
    price-per-level: 200
    # Pay with experience levels instead of money (money needs Vault and an economy plugin).
    use-player-levels: false

attack-mode:
  # What dogs in attack mode (/mydog attack) go after: "monsters" for every hostile mob, or "list" for only the
  # mobs in targets. Other players' pets, NPCs and players are never attacked.
  target: monsters
  targets: [zombie, husk, drowned, skeleton, stray, bogged, spider, cave_spider, pillager, vindicator, witch]
  # Never attacked, also not when they attack the owner. Vanilla wolves leave creepers alone too.
  ignore: [creeper]
  # Mobs attacking the owner come first, whether they are listed or not.
  defend-owner-first: true
  # Leave all MythicMobs mobs alone (this includes McPets pets).
  ignore-mythic-mobs: false

breeds:
  # Wolves tamed before breeds existed (Minecraft 1.20.5) all became Pale, and wolves from before personalities
  # (sound variants, 1.21.5) all sound Classic. Owners of such dogs may pick a breed and a personality once, for
  # free, with /mydog breed and /mydog personality. Set the dates to when your server updated, if that was later.
  free-choice:
    enabled: true
    # Dogs born before this date that are still Pale may pick a breed.
    breed-cutoff: '2024-04-23'
    # Dogs born before this date that still sound Classic may pick a personality.
    personality-cutoff: '2025-03-25'
  # Dog treats change the breed or personality of the dog they're used on (right-click your dog with one).
  # Admins can also hand them out with /mydog givetreat, e.g. for shops, auctions or crates.
  treats:
    enabled: true
    # A recipe per breed and per personality: 3 rows of 3 ingredient letters (a space is an empty slot), and what
    # each letter stands for. Set craftable to false to only hand the treat out with /mydog givetreat; remove an
    # entry to have no treat for it at all.
    breeds:
      pale: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: spruce_sapling, B: bone}}
      woods: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: oak_sapling, B: bone}}
      ashen: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: charcoal, B: bone}}
      black: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: podzol, B: bone}}
      chestnut: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: mossy_cobblestone, B: bone}}
      rusty: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: cocoa_beans, B: bone}}
      spotted: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: acacia_sapling, B: bone}}
      striped: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: terracotta, B: bone}}
      snowy: {craftable: true, shape: [DSD, SBS, DSD], ingredients: {D: diamond, S: snow_block, B: bone}}
    personalities:
      classic: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: note_block, B: bone}}
      big: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: bone_block, B: bone}}
      cute: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: pink_petals, B: bone}}
      puglin: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: porkchop, B: bone}}
      angry: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: blaze_powder, B: bone}}
      grumpy: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: rotten_flesh, B: bone}}
      sad: {craftable: true, shape: [GSG, SBS, GSG], ingredients: {G: gold_block, S: ghast_tear, B: bone}}

levels:
  # Let dogs gain experience and level up by killing mobs.
  enabled: true
  # Sound played to the owner on level-up. Takes a sound key, see
  # https://minecraft.wiki/w/Sounds.json#Sound_events
  level-up-sound: entity.wolf.ambient
  # Let dogs gain experience from killing players.
  player-kill-experience: true
  # "table" uses the table below. "scaled" builds the levels from the scaled section instead, for a quick setup
  # (it has no player-damage or effects).
  mode: table
  scaled:
    max-level: 20
    # Experience needed for the last level.
    max-experience: 10000
    # 1 makes every level the same step up; higher makes the first levels quick and the last ones much harder.
    experience-curve: 2.0
    # Level 1 gets min, the last level max, and the levels between are spread evenly.
    health: {min: 40, max: 80}
    damage: {min: 4, max: 20}
  # Experience needed for each level, and the max health and attack damage it gives.
  # Health is in half hearts (40 = 20 hearts, what a vanilla tamed wolf has). Vanilla wolves deal 4 damage.
  # Add player-damage to a level to make its dogs deal a different amount of damage to players, e.g.
  #   10: {experience: 5000, health: 72, damage: 20, player-damage: 6}
  # Add effects to give dogs potion effects from that level up, e.g. effects: [speed:1, regeneration:2] for Speed I and
  # Regeneration II. A higher level can raise an effect, or remove it with :0. See
  # https://minecraft.wiki/w/Effect#Effect_list for the names.
  table:
    1: {experience: 0, health: 40, damage: 4}
    2: {experience: 10, health: 42, damage: 5}
    3: {experience: 100, health: 44, damage: 6}
    4: {experience: 200, health: 46, damage: 7}
    5: {experience: 500, health: 48, damage: 8}
    6: {experience: 1000, health: 52, damage: 11}
    7: {experience: 2000, health: 58, damage: 13}
    8: {experience: 3000, health: 62, damage: 15}
    9: {experience: 4000, health: 66, damage: 17}
    10: {experience: 5000, health: 72, damage: 20}
  # Experience a dog gets for each kill.
  # Keys are entity types, see https://minecraft.wiki/w/Java_Edition_data_values#Entities
  experience-per-kill:
    # Mobs that are not listed below (including mobs added to Minecraft later) give this much; 0 gives nothing.
