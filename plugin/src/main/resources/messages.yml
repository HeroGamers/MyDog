# MyDog messages, written in MiniMessage: https://docs.advntr.dev/minimessage/format.html
#
# Placeholders that work in every message:
#   <prefix>    the chat prefix below
#   <plugin>    the plugin name and version
# Messages about a dog also have:
#   <dog_name>  the dog's name, in its collar color
#   <id>        the dog's ID, as shown in /mydog list
#   <level>     the dog's level
#   <owner>     the name of the dog's owner
#   <breed>     the dog's breed (Pale, Snowy, Woods, ...)
#   <personality> how the dog sounds (Classic, Big, Cute, Puglin, Angry, Grumpy, Sad)
# Other placeholders are listed next to the message that has them.
#
# A message can also be a list of lines. An empty message ('') is not sent at all.

# Used by MyDog to upgrade this file. Do not change it.
messages-version: 1

prefix: MyDog

nametag:
  # The name shown above dogs when levels are shown. <mode> is one of the two modes below.
  # Add <owner> to show whose dog it is, e.g. '<dog_name><gray> [<gold><level></gold>] [<owner>]</gray><mode>'
  with-level: '<dog_name><gray> [<gold><level></gold>]</gray><mode>'
  # The name shown when levels are turned off or hidden.
  plain: '<dog_name>'
  attack-mode: '<gray>[<red>⚔</red>]'
  defend-mode: '<gray>[<green>⛨</green>]'

tame:
  new-dog: '<gold><bold>[<prefix>]</bold> Congratulations with your new dog, <dog_name>!'
  limit-reached: '<red><bold>[<prefix>]</bold> Taming failed! Looks like you have reached your limit of dogs! You can maybe set some dead dogs free, or revive some?'

dog:
  level-up: '<dark_purple><bold>[<prefix>]</bold> Your dog, <dog_name>, just leveled up to <light_purple>Level <level></light_purple>!'
  # <time> how long the dog lived. <level_text> is dog.died-level, or nothing when levels are off.
  died: '<red><bold>[<prefix>]</bold> Your dog, <dog_name>, just passed away... <dog_name> lived for <time><level_text>.'
  died-level: ', and got to <dark_red>Level <level></dark_red>'
  # <health> the dog's health left.
  low-health: '<gold><bold>[<prefix>]</bold> <dog_name> has low health! <gray>(<red><health></red>)'
  petting: "<gold>Who's a good doggo?! <dog_name> is!"
  petting-splash: '<dog_name><gold> splashes water all over you!'
  # A dog ate from its owner's inventory (dogs.auto-feed). <food> what it ate. Set to '' to turn it off.
  auto-fed: '<gray><dog_name><gray> ate some <food> from your inventory.'
  # Shown when a player right-clicks someone else's dog. Set to '' to turn it off.
  owner-info: '<gray>This is <dog_name><gray>, <owner>''s dog.'

treat:
  breed:
    # The treat item. <breed> the breed it gives.
    name: '<gold><breed> Dog Treat'
    lore:
      - '<gray>Give it to your dog to turn'
      - '<gray>it into a <white><breed></white> wolf.'
    same: '<gold><dog_name><gold> already is a <white><breed></white> wolf.'
    used: '<gold><dog_name><gold> is now a <white><breed></white> wolf!'
  personality:
    # The treat item. <personality> the personality (sound) it gives.
    name: '<light_purple><personality> Dog Treat'
    lore:
      - '<gray>Give it to your dog to give it'
      - '<gray>a <white><personality></white> personality.'
    same: '<gold><dog_name><gold> already has a <white><personality></white> personality.'
    used: '<gold><dog_name><gold> now has a <white><personality></white> personality!'
  not-your-dog: '<red>You can only give treats to your own dogs.'
  disabled: '<red>This treat no longer works on this server.'

teleport:
  no-safe-location: "<red><bold>[<prefix>]</bold> Hello! Looks like you just teleported away from your Pet(s)! They can sadly not find a safe place to stay, so they are staying behind for now :( They will be waiting for you where you left them..."

time:
  minute: '1 minute'
  minutes: '<amount> minutes'
  hour: '1 hour'
  hours: '<amount> hours'
  day: '1 day'
  days: '<amount> days'
  # How two or three parts are joined, e.g. "2 days, 3 hours and 5 minutes".
  separator: ', '
  last-separator: ' and '

command:
  header: '<yellow>---------------- <plugin> ----------------'
  unknown: '<red>Not a MyDog command! Check /mydog help'
  # <usage> the right way to use the command.
  usage: '<red>Usage: <usage>'
  no-permission: "<red>You don't have permission to do that."
  player-only: '<red>Only players can use this command.'
  # Another plugin stopped the action (through MyDog's API events).
  cancelled: '<red>Another plugin stopped that.'
  invalid-id: '<red><bold>[<prefix>]</bold> Please enter a valid ID! Check /mydog list'
  dog-not-found: '<red><bold>[<prefix>]</bold> Could not find a Dog with that ID! Check /mydog list'
  dog-not-loaded: '<red><bold>[<prefix>]</bold> Aww bonkers! Seems like your Dog cannot be found... Is it loaded?'
  # <name> the player name that was typed.
  owner-not-found: "<red><bold>[<prefix>]</bold> No player called <name> has any dogs."
  # A co-owner tried something only the owner may do (release, trade, set ID, ...).
  owner-only: "<red><bold>[<prefix>]</bold> Only <owner> can do that with <dog_name><red>."
  # <owned> how many dogs the player owns. <dogs> is "dog" or "dogs".
  info:
    - '<yellow>---------------- <plugin> ----------------'
    - '<aqua>By HeroGamers (Fido2603)'
    - ''
    - '<aqua>You currently own <white><owned></white> <dogs>!'
    - ''
    - '<aqua>Use <white>/mydog help</white> for a list of commands!'
  info-dog: 'dog'
  info-dogs: 'dogs'
  help:
    # <usage> the command, <description> what it does.
    entry: '<aqua><usage><white> - <description>'
    help: 'This command'
    reload: 'Reloads the MyDog configuration'
    save: 'Saves all dog data to disk'
    list: 'View a list with your current Dogs'
    putdown: 'Kills a dog you own'
    release: 'Set one of your Dogs free!'
    comehere: 'Forces your Dog to teleport to your location'
    sit: 'Tells your dog(s) to sit and keep their position(s)'
    stand: 'Tells your dog(s) to stand up and roam free'
    attack: 'Tells your dog(s) to attack any mobs nearby'
    defend: 'Tells your dog(s) to defend you'
    calm: 'Makes your dog(s) stop fighting and leave everything alone for a moment'
    store: 'Puts your dog(s) away until you summon them'
    share: 'Lets a friend look after one of your Dogs too'
    unshare: 'Stops sharing a Dog with a friend'
    summon: 'Brings stored dog(s) back to you'
    trade: 'Send a trade request to another player'
    tradeaccept: 'Accept a trade'
    tradedecline: 'Decline a trade'
    stats: 'Gets stats and other info about a Dog you own'
    rename: 'Renames a Dog you own'
    setid: 'Assigns a custom ID to a Dog you own'
    setlevel: "Sets a dog's level"
    dead: 'List of Dogs that have gone to another world'
    revive: 'Resurrects a Dog for a fee'
    breed: "Shows a Dog's breed, or picks one for Dogs from before breeds existed"
    personality: "Shows a Dog's personality, or picks one for Dogs from before personalities existed"
    givetreat: 'Gives a player dog treats'
  # <options> the breeds or personalities to choose from.
  breed:
    info: '<aqua><dog_name><aqua> is a <white><breed></white> wolf.'
    free-choice: '<gold><dog_name><gold> is from before wolf breeds existed, so you may pick its breed once, for free, with <white>/mydog breed <id> [name]</white>. Options: <white><options>'
    no-free-choice: "<gold>Only dogs from before wolf breeds existed get a free pick. To change <dog_name><gold>'s breed, give it a breed treat."
    unknown: '<red>Unknown breed. Options: <white><options>'
    done: '<gold><dog_name><gold> is now a <white><breed></white> wolf!'
    free-choice-reminder: '<gold><dog_name><gold> is from before wolf breeds existed. Pick its breed for free with <white>/mydog breed <id> [name]</white>!'
  personality:
    info: '<aqua><dog_name><aqua> has a <white><personality></white> personality.'
    free-choice: '<gold><dog_name><gold> is from before wolf personalities existed, so you may pick one once, for free, with <white>/mydog personality <id> [name]</white>. Options: <white><options>'
    no-free-choice: "<gold>Only dogs from before personalities existed get a free pick. To change <dog_name><gold>'s personality, give it a personality treat."
    unknown: '<red>Unknown personality. Options: <white><options>'
    done: '<gold><dog_name><gold> now has a <white><personality></white> personality!'
    free-choice-reminder: '<gold><dog_name><gold> is from before wolf personalities existed. Pick one for free with <white>/mydog personality <id> [name]</white>!'
  givetreat:
    unknown: '<red>No such treat. Use breed or personality, and a name set up under breeds.treats in config.yml.'
    # <max> the most treats given at once.
    invalid-amount: '<red>The amount must be between 1 and <max>.'
    # <treat> e.g. "Snowy breed", <player> who got it, <amount> how many.
    done: '<gold>Gave <player> <amount>x <treat> treat.'
    received: '<gold>You received <amount>x <treat> treat!'
  reload:
    done: '<yellow><plugin>:<aqua> Reloaded the configuration.'
    failed: '<red>Reloading failed, see the console for why. The old configuration is still in use.'
  save:
    done: '<yellow><plugin>:<aqua> Saved all dog data.'
  list:
    # <health> is list.health, or nothing when the dog is not loaded.
    entry: '<aqua>#<id><white> - <dog_name><health>'
    # <current> and <max> health.
    health: ' <blue>(HP: <current>/<max>)'
    empty: "<aqua>You don't have any dogs yet. Tame a wolf with a bone!"
    # Shown instead of the health for stored dogs.
    stored: ' <gray>(stored)'
    shared-header: '<gray>Shared with you:'
    # A dog that isn't yours: <qualified_id> is how you pick it in commands (owner:id).
    shared-entry: '<aqua><qualified_id><white> - <dog_name><health>'
  dead:
    # <price> the revival price.
    entry: '<aqua>#<id><white> - <dog_name><white> LVL <level> <green>$<price>'
    entry-levels: '<aqua>#<id><white> - <dog_name><white> LVL <level> <green><price> levels'
    empty: "<aqua>None of your dogs have passed away."
  rename:
    invalid-length: '<red><bold>[<prefix>]</bold> Please choose a name between 1 and 16 characters for your Dog!'
    done: '<aqua><bold>[<prefix>]</bold> From now on, I will call you <dog_name>!'
  setid:
    invalid: '<red><bold>[<prefix>]</bold> Your Dog''s ID has to be a whole number above 0!'
    done: '<aqua><bold>[<prefix>]</bold> New Dog ID successfully set!'
  setlevel:
    # <max> the highest level in the level table.
    out-of-range: '<gold>The level must be between 1 and <max>!'
    done: '<gold><dog_name> is now <aqua>Level <level></aqua>.'
    levels-disabled: '<gold>Levels are turned off on this server.'
  putdown:
    done: "<aqua><bold>[<prefix>]</bold> I'm sorry my friend..."
  release:
    done: '<aqua><bold>[<prefix>]</bold> It was great having you here, <dog_name>...'
  sit:
    all: '<aqua><bold>[<prefix>]</bold> Sit, my dogs!'
    one: '<aqua><bold>[<prefix>]</bold> Sit, <dog_name>!'
  stand:
    all: '<aqua><bold>[<prefix>]</bold> Stand, my dogs!'
    one: '<aqua><bold>[<prefix>]</bold> Stand, <dog_name>!'
  attack:
    all: '<aqua><bold>[<prefix>]</bold> Attack, my dogs!'
    one: '<aqua><bold>[<prefix>]</bold> Attack, <dog_name>!'
  defend:
    all: '<aqua><bold>[<prefix>]</bold> Defend me, my dogs!'
    one: '<aqua><bold>[<prefix>]</bold> Defend me, <dog_name>!'
  # <count> how many dogs were stored or summoned.
  store:
    one: '<aqua><bold>[<prefix>]</bold> <dog_name><aqua> is stored away safely.'
    all: '<aqua><bold>[<prefix>]</bold> Stored <count> dogs away safely.'
    not-loaded: '<red><bold>[<prefix>]</bold> <dog_name><red> has to be nearby to be stored.'
    already: '<red><bold>[<prefix>]</bold> That dog is already stored.'
    none: '<red><bold>[<prefix>]</bold> You have no dogs to store.'
  summon:
    one: '<aqua><bold>[<prefix>]</bold> Welcome back, <dog_name><aqua>!'
    all: '<aqua><bold>[<prefix>]</bold> Summoned <count> dogs.'
    already: "<red><bold>[<prefix>]</bold> That dog isn't stored."
    none: "<red><bold>[<prefix>]</bold> You don't have any stored dogs."
  # <player> the friend the dog is shared with (or the owner, in received messages).
  share:
    done: '<aqua><bold>[<prefix>]</bold> <player> can now look after <dog_name><aqua> too.'
    received: '<aqua><bold>[<prefix>]</bold> <player> shared <dog_name><aqua> with you! Call it with <white>/mydog comehere <qualified_id></white>.'
    already: '<red><bold>[<prefix>]</bold> <dog_name><red> is already shared with <player>.'
    self: '<red><bold>[<prefix>]</bold> That dog is already yours!'
  unshare:
    done: '<aqua><bold>[<prefix>]</bold> <player> no longer looks after <dog_name><aqua>.'
    received: '<aqua><bold>[<prefix>]</bold> <player> stopped sharing <dog_name><aqua> with you.'
    not-shared: "<red><bold>[<prefix>]</bold> <dog_name><red> isn't shared with <player>."
  # <seconds> how long the dogs stay calm.
  calm:
    all: '<aqua><bold>[<prefix>]</bold> Easy, my dogs! <gray>(calm for <seconds>s)'
    one: '<aqua><bold>[<prefix>]</bold> Easy, <dog_name>! <gray>(calm for <seconds>s)'
  comehere:
    done: '<gold><bold>[<prefix>]</bold> Come here! Good doggo, <dog_name>!'
    unreachable: '<red><bold>[<prefix>]</bold> Aww bonkers! Seems like your Dog is at a location that cannot be loaded right now!'
    stored: '<red><bold>[<prefix>]</bold> <dog_name><red> is stored. Bring it back with <white>/mydog summon <id></white>.'
  stats:
    name: '<aqua>Name: <dog_name>'
    # Shown once MyDog has seen the dog's wolf since this was added.
    breed: '<aqua>Breed: <white><breed> <gray>(<personality>)'
    level: '<aqua>Level: <white><level>'
    # <bar> a progress bar, <current> and <next> experience.
    experience: '<aqua>Experience: <bar> <aqua><bold>[</bold><dark_aqua><current></dark_aqua><bold>/</bold><next><bold>]'
    # <bar> a progress bar, <current> and <max> health.
    health: '<aqua>Health: <bar> <aqua><bold>[</bold><dark_aqua><current></dark_aqua><bold>/</bold><max><bold>]'
    # <damage> the dog's attack damage.
    damage: '<aqua>Damage: <white><damage> HP'
    # Only shown when the dog wears wolf armor. <bar> a progress bar, <durability> and <max> durability left.
    armor: '<aqua>Armor: <bar> <aqua><bold>[</bold><dark_aqua><durability></dark_aqua><bold>/</bold><max><bold>]'
    # <world>, <x>, <y> and <z> where the dog was last seen.
    last-seen: '<aqua>Last Seen at: <dark_aqua>World: <white><world> <dark_aqua>X: <white><x> <dark_aqua>Y: <white><y> <dark_aqua>Z: <white><z>'
  revive:
    not-found: "<red>You don't have a dead dog with that ID."
    not-enough-money: "<red>You don't have enough funds to resurrect the dog."
    # <missing> how many more levels the player needs.
    not-enough-levels: "<red>You don't have enough power to resurrect the dog. You need <gold><missing></gold> more levels!"
    done: '<green>Your dog has been resurrected.'
  trade:
    player-not-found: '<red><bold>[<prefix>]</bold> Could not find a player with that name!'
    self: '<red><bold>[<prefix>]</bold> You cannot send a trade request to yourself!'
    invalid-price: '<red><bold>[<prefix>]</bold> Please enter a valid price!'
    dead-dog: '<gold>You cannot trade dead dogs!'
    no-economy: '<gold>No economy provider found, you cannot trade dogs for cash!'
    receiver-cannot-afford: "<gold>It doesn't look like the receiver will be able to.. afford that.."
    receiver-has-pending: '<gold>The receiver already has a trade pending!'
    receiver-no-permission: "<gold>The receiver doesn't have permissions to trade!"
    receiver-limit: '<gold>The receiver has reached their dog limit!'
    # <sender> the player offering the dog, <price> the price.
    request:
      - '<gold>You have received a dog trade request from <aqua><sender></aqua>!'
      - '<aqua><sender></aqua> is offering <dog_name><gold><level_text> for <aqua><price></aqua>!'
      - ''
      - '<gold>Accept the trade request with <aqua>/mydog tradeaccept'
      - '<gold>Decline the trade request with <aqua>/mydog tradedecline'
      - '<gold>Request expires in 30 seconds!'
    request-level: ' (<aqua>Level <level></aqua>)'
    request-free: 'free'
    sent: '<gold>Trade request successfully sent!'
    expired: '<gold>Dog trade expired!'
    expired-sender: "<gold>Recipient didn't answer to dog trade!"
    no-pending: "<gold>You don't have any pending trades!"
    cannot-afford: "<gold>You don't have enough money to trade for that dog!"
    limit: '<gold>You cannot own any more dogs!'
    dog-missing: '<gold>The dog you are trying to accept cannot be found! Is it dead?'
    accepted: '<gold>You successfully accepted the trade request!'
    accepted-sender: '<gold>Dog trade request got accepted by recipient!'
    denied: '<gold>You successfully denied the trade request!'
    denied-sender: '<gold>Dog trade request got denied by recipient!'
